name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check documentation governance
        if: github.event_name == 'pull_request'
        run: node scripts/check-documentation-governance.mjs

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: worker-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Cloudflare Prod"

    concurrency:
      group: cloudflare-iptv-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@v7
        with:
          name: worker-dist
          path: dist/

      - name: Check commit freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_MAIN=$(git ls-remote \
            https://github.com/vladimino/iptv-watchlist.git \
            refs/heads/main | cut -f1)

          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated commit $GITHUB_SHA"
            echo "Current main: $CURRENT_MAIN"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release description
        if: steps.freshness.outputs.deploy == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git log -1 --format=%s)"
          message="$subject"

          # For GitHub merge commits, use the PR title.
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            pr="${BASH_REMATCH[1]}"
            title="$(git log -1 --format=%b |
              sed -n '/[^[:space:]]/{s/^[[:space:]]*//;p;q;}')"

            if [[ -n "$title" ]]; then
              message="PR #${pr}: ${title}"
            fi
          fi

          # Normalize the message for Wrangler CLI arguments.
          message="${message//$'\r'/ }"
          message="${message//$'\n'/ }"
          message="${message//\\/}"
          message="${message//\"/}"
          message="${message:0:160}"

          printf 'message=%s\n' "$message" >> "$GITHUB_OUTPUT"
          echo "Cloudflare release: $message"

      - name: Check Cloudflare API access
        id: cloudflare-access
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          classify() {
            case "$1" in
              200) echo "ok" ;;
              401) echo "token rejected" ;;
              403) echo "permission denied" ;;
              404) echo "not found" ;;
              429) echo "rate limited" ;;
              5*) echo "cloudflare unavailable" ;;
              *) echo "unexpected" ;;
            esac
          }

          curl_class() {
            case "$1" in
              6) echo "dns failure" ;;
              7) echo "connection failed" ;;
              28) echo "timeout" ;;
              35) echo "tls error" ;;
              *) echo "network error" ;;
            esac
          }

          failed=0

          status_check() {
            local name="$1"
            local url="$2"
            local curl_exit=0
            local status
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$url")" || curl_exit=$?
            if [ "$curl_exit" -ne 0 ]; then
              echo "${name}: $(curl_class "$curl_exit") (curl exit ${curl_exit})"
              failed=1
              return 0
            fi
            echo "${name}: HTTP ${status} ($(classify "$status"))"
            [ "$status" = "200" ] || failed=1
          }

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          status_check "account token verify" "${api}/tokens/verify"
          status_check "worker settings" "${api}/workers/scripts/iptv/settings"

          if [ "$failed" -ne 0 ]; then
            echo "Cloudflare API diagnostics failed; deployment was not started."
            exit 1
          fi

          echo "Cloudflare API diagnostics succeeded; continuing deployment."

      - name: Deploy verified build
        if: steps.freshness.outputs.deploy == 'true' && steps.cloudflare-access.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: >-
            deploy
            --message "${{ steps.release.outputs.message }}"
