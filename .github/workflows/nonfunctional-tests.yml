# AIR-490. Mutant-kill checks and runner wall-clock checks. A red run is a regression signal.
# It is not a needs of Deploy to Cloudflare and it is not a branch-protection required check.
# 04:17 UTC is 05:17 Europe/Madrid while the offset is UTC+1 and 06:17 while it is UTC+2.
# Minute 17 avoids GitHub's documented high-load drop of scheduled runs at :00.
name: Non-functional tests

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nonfunctional-tests
  cancel-in-progress: false

jobs:
  nonfunctional:
    name: Non-functional tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # AIR-490: Node.js 22 for this workflow only. footer-memory-profile.mjs (AIR-519) needs node:sqlite, which Node 20 lacks.
      # Required core CI stays on Node.js 20 (ci.yml); this nightly is not a deploy gate.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run non-functional tests
        # AIR-490: --jobs 3 instead of the default 6 on the 4 vCPU runner. Run 44310326343 (18 Nov 2026) hit the 300 s per-file
        # limit in both canonical-producer-driver-mutation halves while six heavy mutation files ran at once. The per-file
        # timeout and fail-fast stay as they are.
        run: npm test -- --suite non-functional --jobs 3
        env:
          IPTV_TEST_REPORT: nonfunctional-report.json

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nonfunctional-test-report
          path: nonfunctional-report.json
          retention-days: 14
          if-no-files-found: warn
