name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: worker-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Cloudflare Prod"

    concurrency:
      group: cloudflare-iptv-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@v7
        with:
          name: worker-dist
          path: dist/

      - name: Check commit freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_MAIN=$(git ls-remote \
            https://github.com/vladimino/iptv-watchlist.git \
            refs/heads/main | cut -f1)

          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated commit $GITHUB_SHA"
            echo "Current main: $CURRENT_MAIN"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release description
        if: steps.freshness.outputs.deploy == 'true'
        id: release
        shell: bash
        run: |
          set -euo pipefail

          subject="$(git log -1 --format=%s)"
          message="$subject"

          # For GitHub merge commits, use the PR title.
          if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
            pr="${BASH_REMATCH[1]}"
            title="$(git log -1 --format=%b |
              sed -n '/[^[:space:]]/{s/^[[:space:]]*//;p;q;}')"

            if [[ -n "$title" ]]; then
              message="PR #${pr}: ${title}"
            fi
          fi

          # Normalize the message for Wrangler CLI arguments.
          message="${message//$'\r'/ }"
          message="${message//$'\n'/ }"
          message="${message//\\/}"
          message="${message//\"/}"
          message="${message:0:160}"

          printf 'message=%s\n' "$message" >> "$GITHUB_OUTPUT"
          echo "Cloudflare release: $message"

      - name: Check Cloudflare API access
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          classify() {
            case "$1" in
              200) echo "ok" ;;
              401) echo "token rejected" ;;
              403) echo "permission denied" ;;
              404) echo "not found" ;;
              429) echo "rate limited" ;;
              5*) echo "cloudflare unavailable" ;;
              *) echo "unexpected" ;;
            esac
          }

          token_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify")"
          echo "account token verify: HTTP ${token_status} ($(classify "$token_status"))"

          settings_status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/iptv/settings")"
          echo "worker settings: HTTP ${settings_status} ($(classify "$settings_status"))"

          if [ "$token_status" != "200" ] || [ "$settings_status" != "200" ]; then
            echo "Cloudflare API diagnostics failed; deployment was not started."
            exit 1
          fi

          echo "Cloudflare API diagnostics succeeded; continuing deployment."

      - name: Prepare Wrangler diagnostic log directory
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: mkdir -p "${{ runner.temp }}/wrangler-diagnostics"

      - name: Deploy verified build
        id: deploy
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        env:
          WRANGLER_LOG: debug
          WRANGLER_LOG_SANITIZE: "true"
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-diagnostics/wrangler.log
        with:
          quiet: true
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: >-
            deploy
            --message "${{ steps.release.outputs.message }}"

      - name: Summarize Wrangler diagnostic log
        id: wrangler-log
        if: failure() && steps.freshness.outputs.deploy == 'true' && steps.deploy.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: ${{ runner.temp }}/wrangler-diagnostics/wrangler.log
          SANITIZED_LOG_PATH: ${{ runner.temp }}/wrangler-diagnostics/wrangler.sanitized.log
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$WRANGLER_LOG_PATH" ]; then
            echo "Wrangler diagnostic log was not created. The deploy failure above is unchanged."
            exit 0
          fi
          node scripts/wrangler-diagnostic-summary.mjs "$WRANGLER_LOG_PATH" > "$SANITIZED_LOG_PATH"
          rm -f "$WRANGLER_LOG_PATH"
          if [ ! -s "$SANITIZED_LOG_PATH" ]; then
            echo "Wrangler diagnostic summary was empty. The deploy failure above is unchanged."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "Allowlisted Wrangler diagnostic summary is ready for upload."

      - name: Upload Wrangler diagnostic log
        if: failure() && steps.freshness.outputs.deploy == 'true' && steps.deploy.outcome == 'failure' && steps.wrangler-log.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: wrangler-deploy-debug
          path: ${{ runner.temp }}/wrangler-diagnostics/wrangler.sanitized.log
          retention-days: 1
          if-no-files-found: warn
