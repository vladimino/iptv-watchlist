name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: worker-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: "Cloudflare Prod"

    concurrency:
      group: cloudflare-iptv-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: worker-dist
          path: dist/

      - name: Check commit freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(git ls-remote \
            https://github.com/vladimino/iptv-watchlist.git \
            refs/heads/main | cut -f1)

          if [ "$CURRENT_MAIN" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping outdated commit $GITHUB_SHA"
            echo "Current main: $CURRENT_MAIN"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy verified build
        if: steps.freshness.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
